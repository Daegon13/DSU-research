[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsu-research"
version = "0.1.0"
description = "Small reproducible experimental harness for DSU research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "torchvision>=0.17,<1", "numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dsu-run = "dsu_research.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
